<div class="workspace">
  <header class="topbar">
    <button class="icon-button mobile-only" type="button" aria-label="Open navigation" [attr.aria-expanded]="menuOpen" (click)="menuOpen = !menuOpen"><mat-icon>menu</mat-icon></button>
    <a class="brand" routerLink="/dashboard" aria-label="Qlic dashboard"><span class="brand-mark"><mat-icon>water_drop</mat-icon></span><strong>Qlic</strong></a>
    <div class="topbar-actions">
      <label class="language-select"><span class="sr-only">Language</span><select [value]="localeService.locale()" (change)="setLocale($any($event.target).value)"><option value="en">EN</option><option value="es-419">ES</option></select></label>
      <a class="icon-button notification-button" routerLink="/alerts" aria-label="3 active alerts"><mat-icon>notifications_none</mat-icon><span data-notification-count class="badge">3</span></a>
      <a class="avatar" routerLink="/account" aria-label="Open account">A</a>
    </div>
  </header>
  @if (menuOpen) { <button class="scrim" type="button" aria-label="Close navigation" (click)="menuOpen = false"></button> }
  <aside class="sidebar" [class.sidebar-open]="menuOpen" aria-label="Primary navigation">
    <nav><p class="nav-label">WATER MANAGEMENT</p>
      @for (item of navigation; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" (click)="menuOpen = false"><mat-icon>{{ item.icon }}</mat-icon><span>{{ translate(item.label) }}</span>@if (item.path === '/alerts') { <span class="nav-count">3</span> }</a>
      }
    </nav>
    <div class="sidebar-footer"><a routerLink="/account" routerLinkActive="active"><mat-icon>person_outline</mat-icon>{{ translate('nav.account') }}</a><button type="button" (click)="signOut()"><mat-icon>logout</mat-icon>{{ translate('action.signOut') }}</button></div>
  </aside>
  <main class="content" id="main-content"><router-outlet /></main>
</div>
