<section class="page detail"><a class="back" routerLink="/alerts"><mat-icon>arrow_back</mat-icon>Back to alerts</a><article class="panel detail-card"><header><span class="symbol"><mat-icon>warning_amber</mat-icon></span><div><app-status-chip [label]="alert.severity" [tone]="alert.severity" /><h1>{{ alert.title }}</h1><p>{{ alert.location }} · {{ alert.time }}</p></div></header><div class="description"><h2>What happened</h2><p>{{ alert.description }}</p></div><div class="recommendation"><mat-icon>tips_and_updates</mat-icon><div><h3>Recommended action</h3><p>Inspect the water point and verify the current reading before acknowledging this alert.</p></div></div><button class="primary-action" type="button" (click)="service.acknowledge(alert.id)">Acknowledge alert</button></article></section>
