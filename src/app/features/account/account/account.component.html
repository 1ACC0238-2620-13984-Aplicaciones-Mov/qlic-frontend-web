<section class="page account-page"><header class="page-heading"><div><p class="eyebrow-page">{{ 'ACCOUNT' | translate }}</p><h1>{{ 'Profile and preferences' | translate }}</h1><p>{{ 'Manage your personal workspace settings.' | translate }}</p></div></header><div class="account-grid"><article class="panel profile"><div class="large-avatar">A</div><h2>Alexander</h2><p>{{ 'Administrator' | translate }}</p><span>demo&#64;qlic.com</span></article><article class="panel preferences"><h2>{{ 'Preferences' | translate }}</h2><label><span><mat-icon>language</mat-icon><b>{{ 'Language' | translate }}</b></span><select [value]="locale.locale()" (change)="locale.setLocale($any($event.target).value)"><option value="en">{{ 'English' | translate }}</option><option value="es-419">{{ 'Español (Latinoamérica)' | translate }}</option></select></label><label><span><mat-icon>schedule</mat-icon><b>{{ 'Time zone' | translate }}</b></span><select><option>America/Lima (UTC-5)</option></select></label><label><span><mat-icon>straighten</mat-icon><b>{{ 'Measurement units' | translate }}</b></span><select><option>{{ 'Metric' | translate }}</option></select></label><button class="outline-action sign-out" type="button" (click)="signOut()"><mat-icon>logout</mat-icon>{{ 'action.signOut' | translate }}</button></article></div></section>
