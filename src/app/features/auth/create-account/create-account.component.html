<main class="create-page"><section class="create-card"><a routerLink="/sign-in">← Back to sign in</a><p class="eyebrow">GET STARTED</p><h1>Create your Qlic account</h1><p>Set up your local workspace and start monitoring your water usage.</p><form [formGroup]="form" (ngSubmit)="submit()"><label>Full name<input formControlName="name" placeholder="Your name" /></label><label>Email address<input type="email" formControlName="email" placeholder="you@company.com" /></label><label>Password<input type="password" formControlName="password" placeholder="At least 8 characters" /></label>@if (form.touched && form.invalid) { <div class="error" role="alert">Complete all fields with valid information.</div> }<button type="submit">Create account</button></form></section></main>
